; Independent layout experiment. Explicit -e is required; no upload target.
[platformio]
extra_configs = platformio.ini

[env:esp32-s3-flash16]
extends = env:esp32-s3
board_build.partitions = partitions.flash16.csv
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.flash16
