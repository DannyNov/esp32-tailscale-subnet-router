name: EXPERIMENTAL IDF61 crypto compatibility - no deployment
on:
  push:
    branches: [experiment/idf61-crypto-compat-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-linux:
    # Diagnostic builds: runner image digest and transitive package locks remain gates.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    env:
      PLATFORMIO_CORE_DIR: ${{ github.workspace }}/pio-${{ matrix.replica }}
      PIP_CACHE_DIR: ${{ github.workspace }}/pip-${{ matrix.replica }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Install diagnostic tools
        run: python -m pip install platformio==6.2.0 paramiko==4.0.0 requests==2.34.2
      - name: Run all host suites and independent SDK configure/build
        run: python tools/phase_a_ci.py
      - name: Collect versions and source identity
        if: always()
        run: |
          mkdir -p phase-a-ci
          git rev-parse HEAD > phase-a-ci/source-sha.txt
          git submodule status --recursive > phase-a-ci/submodules.txt
          python --version > phase-a-ci/python.txt
          python -m pip freeze > phase-a-ci/python-packages.txt
          python -m platformio pkg list -e esp32-s3 > phase-a-ci/packages.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: EXPERIMENTAL-BUILD-ONLY-linux-${{ matrix.replica }}
          path: |
            phase-a-ci/
            sdkconfig.esp32-s3
            .pio/build/esp32-s3/diagnostic-components/*.json
          if-no-files-found: error
