name: Build ESP32-S3 firmware

on:
  push:
    branches:
      - fix/tuya-dhcp-renewal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test DHCP ownership and NVS recovery
        run: python tools/run_host_tests.py

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Build esp32-s3
        run: pio run -e esp32-s3

      - name: Collect OTA firmware
        run: |
          mkdir -p artifacts
          cp .pio/build/esp32-s3/firmware.bin artifacts/firmware-0.1.27-tuya6-esp32-s3-ota.bin
          sha256sum artifacts/firmware-0.1.27-tuya6-esp32-s3-ota.bin > artifacts/SHA256SUMS.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-0.1.27-tuya6-ota
          path: artifacts/
          if-no-files-found: error
