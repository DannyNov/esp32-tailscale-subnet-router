name: SPARE diagnostic host lab
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]
    branches: [diagnostic/nettest-response-guard-20261118]
permissions:
  contents: read
concurrency:
  group: spare-diagnostic-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  host:
    if: >-
      github.repository == 'DannyNov/esp32-tailscale-subnet-router' &&
      ((github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/diagnostic/spare-ci-20261119') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'diagnostic/spare-ci-20261119'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile and test host fixtures
        run: python3 tests/spare_ci/run.py --cc clang --sanitize "$RUNNER_TEMP/spare-result"
      - name: Audit pinned MicroLink source (not deployed SPARE)
        run: python3 tests/spare_ci/source_audit.py "$RUNNER_TEMP/spare-result/source-audit.json"
      - name: Negative-control archive SHA check (public source is different)
        run: |
          set +e
          python3 tests/spare_ci/verify_local_source.py external/microlink/components/microlink/src/ml_wg_mgr.c
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "FAIL: expected an archived-SPARE SHA mismatch (exit 2), received $status"
            exit 1
          fi
          echo "PASS: verifier rejects non-matching public MicroLink source"
      - name: Add job summary
        if: always()
        run: |
          report="$RUNNER_TEMP/spare-result/result.md"
          if test -f "$report"; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          python3 - "$RUNNER_TEMP/spare-result/source-audit.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1])
          if not p.exists():
              print("Provenance audit: **NOT AVAILABLE**")
          else:
              obj=json.loads(p.read_text(encoding="utf-8"))
              deployed=obj.get("deployed_spare",{})
              print("### SPARE source provenance")
              print(f"- Archived SPARE: \`{deployed.get('firmware','unknown')}\`, build \`{deployed.get('build','unknown')}\`")
              print(f"- Public MicroLink vs deployed SPARE SHA256: **{deployed.get('source_match','NOT PROVEN')}**")
              print("- Source-check PASS does not establish deployed-SPARE behavior or root cause of PANIC.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spare-host-result
          path: |
            ${{ runner.temp }}/spare-result/result.json
            ${{ runner.temp }}/spare-result/result.md
            ${{ runner.temp }}/spare-result/source-audit.json
          retention-days: 7
          if-no-files-found: error
