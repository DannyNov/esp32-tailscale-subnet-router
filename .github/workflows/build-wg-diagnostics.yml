name: Build OFFICE v0.1.39 (no deployment)
on:
  push:
    branches:
      - integration/office-v0.1.39-20261118
      - diagnostic/wgopt13-loop-latency-v0135
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression suites
        run: |
          python -m pip install paramiko requests
          python tools/run_office_regressions.py
      - name: Build OTA application only
        run: |
          python -m pip install platformio
          pio run -e esp32-s3
      - name: Validate image and collect provenance
        run: |
          mkdir -p artifacts
          python tools/validate_snapshot_image.py
          cp .pio/build/esp32-s3/diagnostic-components/*.json artifacts/
          cp sdkconfig.esp32-s3 artifacts/sdkconfig-built.txt
          cp docs/OFFICE-UPSTREAM-0139.md artifacts/README.md
          python tools/diagnostic_provenance.py
          pio pkg list -e esp32-s3 > artifacts/build-dependencies.txt
          cd artifacts
          sha256sum *.bin > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: office-0.1.39-tuya-wgopt13
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-offline-regression-logs
          path: build/office-tests/
          retention-days: 14
