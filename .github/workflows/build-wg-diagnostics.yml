name: Build wgopt10 raw Wi-Fi TX return diagnostics (no deployment)
on:
  push:
    branches: [diagnostic/wgopt10-wifi-tx-origin-v0135]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host regression tests
        run: |
          python tools/run_host_tests.py
          python tools/run_snmp_tests.py
          python tools/test_routes_0130.py
          python tools/test_exit_0131.py
          python tools/test_upstream_0132.py
          python tools/test_wifi_ps_0133.py
          python tools/test_factory.py
          node tests/host/test_ui.cjs
          node tests/host/test_snmp_ui.cjs
          python tools/test_integration.py
          python tools/test_wg_diagnostics.py
          python tools/test_wgopt1.py
          python tools/test_wgopt2.py
          python tools/test_wgopt4.py
          python tools/test_wgopt5.py
          python tools/test_wgopt6.py
          python tools/test_wgopt9.py
          python tools/test_wgopt10.py
          python tools/test_snapshot_overlay.py
          python tools/test_security_0135.py
          python -m pip install paramiko requests
          python tools/test_ssh_host_keys.py
      - name: Build OTA application only
        run: |
          python -m pip install platformio
          pio run -e esp32-s3
      - name: Validate image and collect provenance
        run: |
          mkdir -p artifacts
          cp .pio/build/esp32-s3/firmware.bin artifacts/firmware-0.1.35-tuya-wgopt10-esp32-s3-ota.bin
          cp .pio/build/esp32-s3/diagnostic-components/*.json artifacts/
          cp sdkconfig.esp32-s3 artifacts/sdkconfig-built.txt
          cp docs/WGOPT10-WIFI-TX-ORIGIN-RU.md artifacts/README.md
          python tools/validate_snapshot_image.py
          python tools/diagnostic_provenance.py
          pio pkg list -e esp32-s3 > artifacts/build-dependencies.txt
          cd artifacts
          sha256sum *.bin > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-0.1.35-tuya-wgopt10
          path: artifacts/
          if-no-files-found: error
